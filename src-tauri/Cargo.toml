[package]
name = "robz-hub"
version = "0.1.9"
description = "Robz açık kaynak uygulamalarını tek yerden indir, güncelle ve başlat."
authors = ["Robz Hub katkıda bulunanları"]
license = "MIT"
repository = "https://github.com/kutsalkiremitci/robz-hub"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls: Windows'un kendi TLS'i (SChannel) ve sertifika deposu; ikili dosya daha küçük, kurumsal vekil
# sunucularla da çalışır.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "perf"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
